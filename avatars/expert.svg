<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="120" fill="#4A90E2"/>
  
  <!-- 内环 - 代表循环 -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>
  
  <!-- 中心对齐符号 - 三层同心圆代表对齐 -->
  <circle cx="128" cy="128" r="35" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="128" cy="128" r="22" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="128" cy="128" r="10" fill="#FFFFFF"/>
  
  <!-- 四个方向的对齐线 -->
  <line x1="128" y1="58" x2="128" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="168" x2="128" y2="198" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="58" y1="128" x2="88" y2="128" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="168" y1="128" x2="198" y2="128" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  
  <!-- MVL 文字 -->
  <text x="128" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MVL</text>
</svg>
